[project]
name = "retail-demand-forecast"
version = "0.1.0"
description = "Reproducible retail demand forecasting tutorials and experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cmdstanpy==1.3.0",
  "holidays==0.105",
  "jinja2==3.1.6",
  "lightgbm==4.6.0",
  "lightning==2.5.5",
  "matplotlib==3.10.8",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "prophet==1.4.0",
  "pytorch-forecasting==1.5.0",
  "pytorch-lightning==2.6.6",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "statsmodels==0.14.5",
  "threadpoolctl==3.6.0",
  "torch==2.8.0",
  "torchmetrics==1.9.0",
  "xgboost==3.1.3",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "jupyterlab>=4,<5",
    "pre-commit==4.3.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false
